name: protocol-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol-ci:
    name: protocol-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: make lint test

  protocol-near:
    name: protocol-near
    runs-on: ubuntu-latest
    container: rust:1.99.1
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
      - run: rustup target add wasm32-unknown-unknown
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh -o /tmp/cargo-near-installer.sh
      - run: CARGO_NEAR_NO_MODIFY_PATH=1 CARGO_NEAR_DISABLE_UPDATE=1 sh /tmp/cargo-near-installer.sh --quiet
      - run: make lint-near test-near build-near

  protocol-evm:
    name: protocol-evm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl --proto '=https' --tlsv1.2 -fsSL https://foundry.paradigm.xyz -o "$RUNNER_TEMP/foundryup-init.sh"
      - env:
          FOUNDRY_DIR: ${{ runner.temp }}/foundry
        run: sh "$RUNNER_TEMP/foundryup-init.sh" --yes
      - env:
          FOUNDRY_DIR: ${{ runner.temp }}/foundry
        run: |
          "$FOUNDRY_DIR/bin/foundryup" --install "$(tr -d '\\r\\n' < contracts/evm/.foundry-version)"
          echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "slither-analyzer==$(< contracts/evm/.slither-version)" "semgrep==$(< contracts/evm/.semgrep-version)"
      - name: Install checksum-verified Aderyn
        run: |
          version="$(tr -d '\\r\\n' < contracts/evm/.aderyn-version)"
          archive="aderyn-x86_64-unknown-linux-gnu.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/Cyfrin/aderyn/releases/download/aderyn-v${version}/${archive}" -o "$RUNNER_TEMP/${archive}"
          checksum="$(tr -d '\\r\\n' < contracts/evm/.aderyn-linux-x86_64-sha256)"
          echo "$checksum  $RUNNER_TEMP/${archive}" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/${archive}" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/aderyn-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - run: make lint-evm test-evm audit-evm audit-semgrep audit-aderyn
