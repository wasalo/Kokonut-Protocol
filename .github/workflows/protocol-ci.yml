name: protocol-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol-ci:
    name: protocol-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: make lint test

  protocol-near:
    name: protocol-near
    runs-on: ubuntu-latest
    container: rust:1.99.1
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
      - run: rustup target add wasm32-unknown-unknown
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh -o /tmp/cargo-near-installer.sh
      - run: CARGO_NEAR_NO_MODIFY_PATH=1 CARGO_NEAR_DISABLE_UPDATE=1 sh /tmp/cargo-near-installer.sh --quiet
      - run: make lint-near test-near build-near
