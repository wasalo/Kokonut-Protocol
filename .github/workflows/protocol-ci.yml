name: protocol-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol-ci:
    name: protocol-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: make lint test

  protocol-near:
    name: protocol-near
    runs-on: ubuntu-latest
    container: rust:1.99.1
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: make lint-near test-near build-near
