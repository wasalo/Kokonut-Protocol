[package]
edition = "2024"
rust-version = "1.88"
name = "near-kit"
version = "0.19.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A clean, ergonomic Rust client for NEAR Protocol"
readme = "README.md"
keywords = [
    "near",
    "blockchain",
    "crypto",
    "web3",
]
categories = [
    "api-bindings",
    "cryptography::cryptocurrencies",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/r-near/near-kit-rs"

[features]
contracts = ["dep:near-kit-macros"]
default = ["rpc"]
file-signer = ["dep:dirs"]
js = ["getrandom/wasm_js"]
keyring = ["dep:keyring"]
mnemonic = [
    "dep:bip39",
    "dep:hmac",
]
rpc = [
    "dep:reqwest",
    "dep:tokio",
    "dep:hyper",
]
tracing = ["dep:tracing"]
wasi-http = [
    "rpc",
    "dep:wasi",
]

[lib]
name = "near_kit"
path = "src/lib.rs"

[[example]]
name = "meta_transactions"
path = "examples/meta_transactions.rs"
required-features = ["rpc"]

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"
required-features = [
    "rpc",
    "contracts",
]

[[test]]
name = "contracts_offline"
path = "tests/contracts_offline.rs"

[[test]]
name = "custom_signer"
path = "tests/custom_signer.rs"

[[test]]
name = "lenient_public_keys"
path = "tests/lenient_public_keys.rs"

[[test]]
name = "macro_derives"
path = "tests/macro_derives.rs"

[[test]]
name = "macro_lints"
path = "tests/macro_lints.rs"

[[test]]
name = "secp256k1_nearcore_compat"
path = "tests/secp256k1_nearcore_compat.rs"

[[test]]
name = "view_metadata"
path = "tests/view_metadata.rs"

[[test]]
name = "wait_level_api"
path = "tests/wait_level_api.rs"

