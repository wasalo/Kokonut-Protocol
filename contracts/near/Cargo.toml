[package]
name = "kokonut-protocol-near"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1", default-features = false }
time = { version = "=0.3.55", features = ["parsing"] }

[features]
sandbox-tests = []

[dev-dependencies]
near-sdk = { version = "=5.29.1", default-features = false, features = ["unit-testing"] }
# Sandbox tests use the local HTTP RPC only; vendor near-kit without reqwest TLS defaults.
near-kit = { version = "=0.19.0" }
near-sandbox = { version = "=0.3.16", features = ["generate"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"
required-features = ["sandbox-tests"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

[patch.crates-io]
near-kit = { path = "vendor/near-kit" }
