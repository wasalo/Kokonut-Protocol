[extend]
useDefault = true

[[rules]]
id = "kokonut-json-credential"
description = "Detect high-entropy values in sensitive properties despite unrelated keys in single-line JSON."
regex = '''(?i)["']?(?:api[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|secret|password|private[_-]?key)["']?\s*:\s*["']([A-Za-z0-9_./+=:-]{16,256})["']'''
secretGroup = 1
entropy = 3.5
